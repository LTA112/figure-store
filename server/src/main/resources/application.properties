spring.application.name=figure-store

server.port=${PORT:8080}

# MySQL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/figure_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=Asia/Ho_Chi_Minh

# JWT
app.jwt.secret=${JWT_SECRET:figure-store-jwt-secret-key-2026-local}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=80MB

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:figure-store}
# Public URLs
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# VNPay sandbox/production merchant configuration
payment.vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}

# ZaloPay merchant credentials (adapter placeholder until merchant credentials are supplied)
payment.zalopay.app-id=${ZALOPAY_APP_ID:}
payment.zalopay.key1=${ZALOPAY_KEY1:}
payment.zalopay.key2=${ZALOPAY_KEY2:}

payment.zalopay.create-url=${ZALOPAY_CREATE_URL:https://sb-openapi.zalopay.vn/v2/create}
payment.zalopay.status-url=${ZALOPAY_STATUS_URL:https://sb-openapi.zalopay.vn/v2/query}

payment.zalopay.redirect-url=${ZALOPAY_REDIRECT_URL:http://localhost:5173/payment/result}
payment.zalopay.callback-url=${ZALOPAY_CALLBACK_URL:https://figure-store-production.up.railway.app/api/payments/zalopay/callback}